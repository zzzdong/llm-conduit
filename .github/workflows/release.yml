name: release

# Push a tag like v0.1.0 to build and publish the release.
# workflow_dispatch runs the same pipeline without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: read
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ -z "$VERSION" ]; then
            echo "could not read the version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building llm-conduit $VERSION"

      - name: Fail if the tag does not match the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          EXPECTED="v${{ steps.read.outputs.version }}"
          if [ "${{ github.ref_name }}" != "$EXPECTED" ]; then
            echo "tag ${{ github.ref_name }} does not match the Cargo.toml version $EXPECTED" >&2
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        # One native runner per architecture. Ubuntu's archives have no musl cross compiler
        # (musl-tools ships musl-gcc for the machine's own architecture only), so every
        # target is built on a machine of that architecture: the toolchain install stays a
        # plain apt call, the C dependency (AWS-LC) is compiled by a real musl gcc rather
        # than a glibc cross compiler, and the binary can be smoke tested on the very
        # runner that produced it.
        # Add more targets here (e.g. x86_64-pc-windows-msvc on windows-latest).
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # GitHub's hosted ARM runner (public repos, or Team/Enterprise for private ones);
          # a self-hosted ARM runner label works just as well.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl-gcc compiles the C dependency (AWS-LC, through CMake). Only CC is set on purpose:
      # rustc's own linker driver already emits a correct static musl binary, whereas pointing
      # CARGO_TARGET_<TARGET>_LINKER at a distribution musl-gcc produces a *dynamic* binary
      # against /lib/ld-musl-*.so.1 (that one segfaults on the x86_64 target). The static check
      # further down rejects both, but only the former actually runs.
      - name: Install musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # aws-lc-sys drives CMake, which the runners ship; install it if a slim image lacks it.
          command -v cmake >/dev/null ||
            sudo apt-get install -y --no-install-recommends cmake
          musl-gcc --version | head -1
          cmake --version | head -1

          echo "CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Check the produced binary
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/llm-conduit"
          file "$BIN"

          # A musl build has to be static to stay dependency-free, but the wording of
          # `file` varies between binutils versions ("statically linked", "static-pie
          # linked", ...), so assert on the ELF itself instead:
          #   no PT_INTERP -> the binary cannot be started through a dynamic loader
          #   no DT_NEEDED -> it does not depend on any shared library
          command -v readelf >/dev/null ||
            { echo "binutils (readelf) is required for this check"; exit 1; }

          segments=$(readelf -l "$BIN") ||
            { echo "error: readelf failed on $BIN"; exit 1; }
          if grep -q INTERP <<<"$segments"; then
            echo "error: $BIN has a program interpreter, so it is not statically linked"
            exit 1
          fi

          # A static-pie binary does have a .dynamic section, so `readelf -d` failing
          # (no dynamic section at all) is fine; what must not happen is a NEEDED entry.
          dynamic=$(readelf -d "$BIN" 2>/dev/null || true)
          if grep -q NEEDED <<<"$dynamic"; then
            echo "error: $BIN depends on shared libraries:"
            grep NEEDED <<<"$dynamic"
            exit 1
          fi

          echo "$BIN is static with no dynamic dependencies"

      # Both artifacts are built natively, so each one runs on the runner that produced it.
      - name: Smoke test
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/llm-conduit"
          "$BIN" --version
          "$BIN" --help >/dev/null

      - name: Package tarball
        run: |
          set -euo pipefail
          NAME="llm-conduit-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/llm-conduit" "dist/$NAME/"
          cp config.example.toml "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -rf "dist/$NAME"
          cd dist
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          cat "$NAME.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-conduit-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        working-directory: dist
        run: |
          set -euo pipefail
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
