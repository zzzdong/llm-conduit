name: release

# Push a tag like v0.1.0 to build and publish the release.
# workflow_dispatch runs the same pipeline without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: read
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ -z "$VERSION" ]; then
            echo "could not read the version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building llm-conduit $VERSION"

      - name: Fail if the tag does not match the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          EXPECTED="v${{ steps.read.outputs.version }}"
          if [ "${{ github.ref_name }}" != "$EXPECTED" ]; then
            echo "tag ${{ github.ref_name }} does not match the Cargo.toml version $EXPECTED" >&2
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add more targets here (e.g. x86_64-pc-windows-msvc on windows-latest).
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross provides the musl toolchains for both targets inside a container.
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Check the produced binary
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/llm-conduit"
          file "$BIN"
          # A musl build has to be static to stay dependency-free. Depending on the
          # toolchain `file` reports either "static-pie linked" or "statically linked".
          file "$BIN" | grep -Eq 'static(-pie)? linked'
          # No shared library dependencies at all.
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "unexpected dynamic dependencies:" >&2
            readelf -d "$BIN" | grep NEEDED >&2
            exit 1
          fi

      - name: Smoke test (native arch only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: ./target/${{ matrix.target }}/release/llm-conduit --version

      - name: Package tarball
        run: |
          set -euo pipefail
          NAME="llm-conduit-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/llm-conduit" "dist/$NAME/"
          cp config.example.toml "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -rf "dist/$NAME"
          cd dist
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          cat "$NAME.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-conduit-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        working-directory: dist
        run: |
          set -euo pipefail
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
